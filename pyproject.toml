[project]
name = "agent-team-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/common",
    "services/memory",
    "services/workflow",
]

[tool.uv.sources]
agentteam-contracts = { workspace = true }
agentteam-common = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = ["."]
