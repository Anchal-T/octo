[project]
name = "agent-team-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/common",
    "services/memory",
    "services/workflow",
    "services/github",
]

[tool.uv.sources]
agentteam-contracts = { workspace = true }
agentteam-common = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pyarrow>=18,<27",
    "pytest>=8,<10",
    "python-dotenv>=1,<2",
    "restate-sdk[harness]>=1.1,<2",
    "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["services", "eval"]
pythonpath = ["."]
