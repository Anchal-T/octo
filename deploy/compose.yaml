services:
  xtdb:
    image: ghcr.io/xtdb/xtdb:2.1.1
    ports:
      - "5432:5432"
      - "18080:8080"
    volumes:
      - xtdb-data:/var/lib/xtdb

  restate:
    image: docker.restate.dev/restatedev/restate:1.8.1
    command: ["--node-name=restate-1"]
    ports:
      - "8080:8080"
      - "9070:9070"
      - "5122:5122"
    volumes:
      - restate-data:/restate-data

  memory:
    build:
      context: ..
      dockerfile: services/memory/Dockerfile
    environment:
      XTDB_HOST: xtdb
    depends_on:
      - xtdb
    ports:
      - "8001:8001"

  workflow:
    build:
      context: ..
      dockerfile: services/workflow/Dockerfile
    environment:
      MEMORY_URL: http://memory:8001
      RESTATE_INGRESS: http://restate:8080
      GITHUB_URL: http://github:8003
      TRIAGER_MODEL: ${TRIAGER_MODEL:-openai/gpt-oss-20b}
      TRIAGER_MAX_TOKENS: ${TRIAGER_MAX_TOKENS:-1024}
      TRIAGER_PROMPT_TOKEN_CAP: ${TRIAGER_PROMPT_TOKEN_CAP:-6000}
      TRIAGER_TIMEOUT_S: ${TRIAGER_TIMEOUT_S:-60}
      TRIAGER_EXPECTED_GENERATION_S: ${TRIAGER_EXPECTED_GENERATION_S:-15}
      TRIAGER_WAIT_CAP_S: ${TRIAGER_WAIT_CAP_S:-7200}
      REPRODUCER_MODEL: ${REPRODUCER_MODEL:-qwen/qwen3.8-27b}
      REPRODUCER_MAX_TOKENS: ${REPRODUCER_MAX_TOKENS:-1200}
      REPRODUCER_PROMPT_TOKEN_CAP: ${REPRODUCER_PROMPT_TOKEN_CAP:-5500}
      REPRODUCER_TIMEOUT_S: ${REPRODUCER_TIMEOUT_S:-60}
      REPRODUCER_EXPECTED_GENERATION_S: ${REPRODUCER_EXPECTED_GENERATION_S:-15}
      REPRODUCER_TURN_CAP: ${REPRODUCER_TURN_CAP:-10}
      FIXER_MODEL: ${FIXER_MODEL:-qwen/qwen3.8-27b}
      FIXER_MAX_TOKENS: ${FIXER_MAX_TOKENS:-1500}
      FIXER_PROMPT_TOKEN_CAP: ${FIXER_PROMPT_TOKEN_CAP:-5500}
      FIXER_TIMEOUT_S: ${FIXER_TIMEOUT_S:-60}
      FIXER_EXPECTED_GENERATION_S: ${FIXER_EXPECTED_GENERATION_S:-15}
      FIXER_TURN_CAP: ${FIXER_TURN_CAP:-8}
      FIXER_MAX_ATTEMPTS: ${FIXER_MAX_ATTEMPTS:-2}
      TESTER_MODEL: ${TESTER_MODEL:-qwen/qwen3.8-27b}
      TESTER_MAX_TOKENS: ${TESTER_MAX_TOKENS:-1024}
      TESTER_PROMPT_TOKEN_CAP: ${TESTER_PROMPT_TOKEN_CAP:-5500}
      TESTER_TIMEOUT_S: ${TESTER_TIMEOUT_S:-60}
      TESTER_EXPECTED_GENERATION_S: ${TESTER_EXPECTED_GENERATION_S:-15}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-agentteam-sandbox:py312}
      SANDBOX_REPO_PATH: /repos/sandbox-repo
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-none}
      SANDBOX_CMD_TIMEOUT_S: ${SANDBOX_CMD_TIMEOUT_S:-60}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}
      GROQ_RESET_TZ: ${GROQ_RESET_TZ:-UTC}
      GROQ_RPM: ${GROQ_RPM:-30}
      GROQ_TPM: ${GROQ_TPM:-8000}
      GROQ_RPD: ${GROQ_RPD:-1000}
      GROQ_TPD: ${GROQ_TPD:-200000}
      MODELS_FREE_HOSTS: ${MODELS_FREE_HOSTS:-https://api.groq.com}
      MODELS_SQLITE_PATH: /var/lib/agent-team/models/models.sqlite
      MODELS_BUSY_TIMEOUT_MS: ${MODELS_BUSY_TIMEOUT_MS:-5000}
    volumes:
      - models-data:/var/lib/agent-team/models
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_REPO_HOST_PATH:-../repos/sqlparse}:/repos/sandbox-repo:ro
    depends_on:
      - memory
      - restate
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # Registers the workflow services with Restate. The workflow service mounts
  # its handlers at /restate/v1, but Restate only calls a service that has been
  # registered, so this runs on every start to pick up new or changed handlers.
  restate-deploy:
    image: docker.restate.dev/restatedev/restate:1.8.1
    entrypoint: ["restate"]
    command:
      ["deployments", "register", "--force", "--yes", "http://workflow:8002/restate/v1"]
    environment:
      RESTATE_ADMIN_URL: http://restate:9070
    depends_on:
      - restate
      - workflow
    restart: "no"

  github:
    profiles: ["github"]
    build:
      context: ..
      dockerfile: services/github/Dockerfile
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APPROVERS: ${GITHUB_APPROVERS:-}
      GITHUB_WORKFLOW_VERSION: ${GITHUB_WORKFLOW_VERSION:-v2}
      GITHUB_REPO: ${GITHUB_REPO:-}
      WORKFLOW_URL: http://workflow:8002
      GITHUB_SQLITE_PATH: /var/lib/agent-team/github/github.sqlite
      GITHUB_POLL_INTERVAL_S: ${GITHUB_POLL_INTERVAL_S:-60}
      GITHUB_MAX_STARTS_PER_CYCLE: ${GITHUB_MAX_STARTS_PER_CYCLE:-1}
      GITHUB_MAX_STARTS_PER_DAY: ${GITHUB_MAX_STARTS_PER_DAY:-10}
      GITHUB_BODY_MAX_CHARS: ${GITHUB_BODY_MAX_CHARS:-8000}
      GITHUB_PROCESS_OWN_ISSUES: ${GITHUB_PROCESS_OWN_ISSUES:-false}
    volumes:
      - github-data:/var/lib/agent-team/github
    depends_on:
      workflow:
        condition: service_healthy
    ports:
      - "8003:8003"

volumes:
  xtdb-data:
  restate-data:
  models-data:
  github-data:
